<!DOCTYPE html>
<html lang="en" class="custom-scrollbar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- C. TODO: Replace with custom SEO title if desired before launch -->
  <title>Gallery | NS Luxury Villa Ho, Volta Region, Ghana</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="bg-luxury-dark text-luxury-cream antialiased selection:bg-luxury-gold selection:text-luxury-dark">

  <!-- Header Placeholder -->
  <header id="main-header"></header>

  <!-- Title Segment -->
  <section class="pt-40 pb-16 relative overflow-hidden bg-gradient-to-b from-luxury-accent/20 to-transparent">
    <div class="max-w-7xl mx-auto px-8 text-left flex flex-col gap-6 relative z-10">
      <div class="flex items-center gap-4">
        <span class="w-16 h-[1px] bg-luxury-gold/50"></span>
        <span class="text-[10px] uppercase tracking-luxury-ultra text-luxury-gold font-medium font-sans">GALLERY</span>
      </div>
      <h1 class="text-editorial-h1 leading-[1.05] tracking-tight">
        A collection <br>
        <span class="italic font-light text-luxury-soft font-serif">of our spaces.</span>
      </h1>
      <p class="text-editorial-lead max-w-xl text-luxury-soft/80 font-light mt-2">
        Browse through Photos of our spaces, including our private villa, gardens, pool, and suites in Ho.
      </p>
    </div>
  </section>

  <!-- Gallery Filters -->
  <section class="py-8 px-8 max-w-7xl mx-auto relative z-10">
    <div class="flex flex-wrap gap-6 justify-start text-[10px] uppercase tracking-luxury font-semibold" id="gallery-filters">
      <button data-filter="all" class="filter-btn pb-2.5 border-b border-luxury-gold text-luxury-gold transition-colors duration-500">All Spaces</button>
      <button data-filter="pool" class="filter-btn pb-2.5 border-b border-transparent text-luxury-soft/60 hover:text-luxury-gold transition-colors duration-500">Poolside</button>
      <button data-filter="rooms" class="filter-btn pb-2.5 border-b border-transparent text-luxury-soft/60 hover:text-luxury-gold transition-colors duration-500">Suites</button>
      <button data-filter="rooftop" class="filter-btn pb-2.5 border-b border-transparent text-luxury-soft/60 hover:text-luxury-gold transition-colors duration-500">Rooftop & Bar</button>
      <button data-filter="surroundings" class="filter-btn pb-2.5 border-b border-transparent text-luxury-soft/60 hover:text-luxury-gold transition-colors duration-500">Gardens</button>
    </div>
  </section>

  <!-- Asymmetric Gallery Grid -->
  <!-- C. TODO: Real photos must replace these Unsplash placeholder photos before launching -->
  <section class="py-12 px-8 max-w-7xl mx-auto relative overflow-hidden reveal-on-scroll">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12" id="gallery-grid">

      <!-- Image 1: Pool -->
      <div class="gallery-item aspect-[3/4] border border-luxury-gold/5 p-2 bg-luxury-dark group cursor-pointer overflow-hidden rounded-none relative shadow-premium" data-category="pool" data-img-src="https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?auto=format&fit=crop&w=1200&q=90">
        <div class="w-full h-full overflow-hidden relative img-zoom-container">
          <!-- PLACEHOLDER: replace with real NS Luxury Villa photo -->
          <img src="https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?auto=format&fit=crop&w=800&q=80" alt="Pool" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-luxury-dark via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 flex flex-col justify-end p-8">
            <span class="text-[8px] uppercase tracking-luxury text-luxury-gold">Poolside</span>
            <span class="font-serif text-xl text-luxury-cream mt-1 font-light">Pool</span>
          </div>
        </div>
      </div>

      <!-- Image 2: Ground Floor Suite -->
      <div class="gallery-item aspect-square border border-luxury-gold/5 p-2 bg-luxury-dark group cursor-pointer overflow-hidden rounded-none relative shadow-premium" data-category="rooms" data-img-src="https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&fit=crop&w=1200&q=90">
        <div class="w-full h-full overflow-hidden relative img-zoom-container">
          <!-- PLACEHOLDER: replace with real NS Luxury Villa photo -->
          <img src="https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&fit=crop&w=800&q=80" alt="Ground floor suite" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-luxury-dark via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 flex flex-col justify-end p-8">
            <span class="text-[8px] uppercase tracking-luxury text-luxury-gold">Suites</span>
            <span class="font-serif text-xl text-luxury-cream mt-1 font-light">Ground floor suite</span>
          </div>
        </div>
      </div>

      <!-- Image 3: Bar -->
      <div class="gallery-item aspect-[3/4] border border-luxury-gold/5 p-2 bg-luxury-dark group cursor-pointer overflow-hidden rounded-none relative shadow-premium lg:mt-12" data-category="rooftop" data-img-src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1200&q=90">
        <div class="w-full h-full overflow-hidden relative img-zoom-container">
          <!-- PLACEHOLDER: replace with real NS Luxury Villa photo -->
          <img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=800&q=80" alt="Bar" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-luxury-dark via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 flex flex-col justify-end p-8">
            <span class="text-[8px] uppercase tracking-luxury text-luxury-gold">Rooftop & Bar</span>
            <span class="font-serif text-xl text-luxury-cream mt-1 font-light">Bar</span>
          </div>
        </div>
      </div>

      <!-- Image 4: Rooftop -->
      <div class="gallery-item aspect-square border border-luxury-gold/5 p-2 bg-luxury-dark group cursor-pointer overflow-hidden rounded-none relative shadow-premium" data-category="rooftop" data-img-src="https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=1200&q=90">
        <div class="w-full h-full overflow-hidden relative img-zoom-container">
          <!-- PLACEHOLDER: replace with real NS Luxury Villa photo -->
          <img src="https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=800&q=80" alt="Rooftop" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-luxury-dark via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 flex flex-col justify-end p-8">
            <span class="text-[8px] uppercase tracking-luxury text-luxury-gold">Rooftop & Bar</span>
            <span class="font-serif text-xl text-luxury-cream mt-1 font-light">Rooftop</span>
          </div>
        </div>
      </div>

      <!-- Image 5: Garden -->
      <div class="gallery-item aspect-[16/10] border border-luxury-gold/5 p-2 bg-luxury-dark group cursor-pointer overflow-hidden rounded-none relative shadow-premium md:col-span-2" data-category="surroundings" data-img-src="https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=1200&q=90">
        <div class="w-full h-full overflow-hidden relative img-zoom-container">
          <!-- PLACEHOLDER: replace with real NS Luxury Villa photo -->
          <img src="https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=1000&q=80" alt="Garden" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-luxury-dark via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 flex flex-col justify-end p-8">
            <span class="text-[8px] uppercase tracking-luxury text-luxury-gold">Gardens</span>
            <span class="font-serif text-xl text-luxury-cream mt-1 font-light">Garden</span>
          </div>
        </div>
      </div>

      <!-- Image 6: Upper Floor Suite -->
      <div class="gallery-item aspect-square border border-luxury-gold/5 p-2 bg-luxury-dark group cursor-pointer overflow-hidden rounded-none relative shadow-premium" data-category="rooms" data-img-src="https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=1200&q=90">
        <div class="w-full h-full overflow-hidden relative img-zoom-container">
          <!-- PLACEHOLDER: replace with real NS Luxury Villa photo -->
          <img src="https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=800&q=80" alt="Upper floor suite" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-luxury-dark via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 flex flex-col justify-end p-8">
            <span class="text-[8px] uppercase tracking-luxury text-luxury-gold">Suites</span>
            <span class="font-serif text-xl text-luxury-cream mt-1 font-light">Upper floor suite</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- High-Fidelity Custom Lightbox Overlay -->
  <div id="gallery-lightbox" class="fixed inset-0 bg-luxury-dark/98 backdrop-blur-2xl z-50 flex items-center justify-center p-6 select-none hidden opacity-0 transition-opacity duration-500">
    <!-- Close button -->
    <button id="lightbox-close" class="absolute top-8 right-8 w-11 h-11 flex items-center justify-center rounded-none border border-luxury-gold/20 text-luxury-gold hover:text-luxury-cream hover:border-luxury-gold/50 transition-colors cursor-pointer" aria-label="Close Lightbox">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <!-- Previous button -->
    <button id="lightbox-prev" class="absolute left-8 w-11 h-11 flex items-center justify-center rounded-none border border-luxury-gold/20 text-luxury-gold hover:text-luxury-cream hover:border-luxury-gold/50 transition-colors cursor-pointer" aria-label="Previous Slide">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    <!-- Next button -->
    <button id="lightbox-next" class="absolute right-8 w-11 h-11 flex items-center justify-center rounded-none border border-luxury-gold/20 text-luxury-gold hover:text-luxury-cream hover:border-luxury-gold/50 transition-colors cursor-pointer" aria-label="Next Slide">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 5l7 7-7 7" />
      </svg>
    </button>

    <!-- Main Content Container -->
    <div class="max-w-5xl max-h-[80vh] w-full flex flex-col justify-center items-center gap-6">
      <div class="relative max-w-full max-h-[70vh] border border-luxury-gold/10 p-2 bg-luxury-dark/80 rounded-none shadow-premium overflow-hidden">
        <img id="lightbox-main-img" src="" alt="Lightbox View" class="max-w-full max-h-[60vh] object-contain select-none transition-transform duration-500 ease-out cursor-zoom-in">
      </div>
      <div class="flex flex-col items-center gap-1.5">
        <span id="lightbox-caption-cat" class="text-[8px] uppercase tracking-luxury text-luxury-gold font-semibold"></span>
        <h4 id="lightbox-caption-title" class="font-serif text-xl text-luxury-cream text-center font-light"></h4>
      </div>
    </div>
  </div>

  <!-- Footer Placeholder -->
  <footer id="main-footer"></footer>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
